; Waveshare ESP32-S3-ePaper-3.97 — SET stock ticker (SJWD)
[env:esp32s3-epaper-397]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/54.03.20/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
; ESP32-S3R8: 8 MB octal PSRAM in the package (display/HTTP buffers live there)
board_build.arduino.memory_type = qio_opi
monitor_speed = 115200
upload_speed = 921600
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DBOARD_HAS_PSRAM
    -DFW_VERSION=\"2026.10.13.1\"
lib_deps =
    adafruit/Adafruit GFX Library@^1.11.11
    olikraus/U8g2_for_Adafruit_GFX@^1.8.0
    bblanchon/ArduinoJson@^7.2.0

; Hardware diagnostic build: pio run -e diag -t upload
[env:diag]
extends = env:esp32s3-epaper-397
build_src_filter = -<*> +<../diag/>
build_flags = ${env:esp32s3-epaper-397.build_flags} -Iinclude

